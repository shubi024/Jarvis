name: Unzip Archives

on:
  workflow_dispatch:        # run on demand from the Actions tab

permissions:
  contents: write           # lets the action commit the extracted files back

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: postleo/unzipp@v1
        with:
          pattern: "**/*.zip"
          delete-zip: "true"
          commit: "true"
